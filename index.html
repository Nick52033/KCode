<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KCode</title>
    <script>
      // 首帧之前确定主题：窗口底色、启动屏与真实界面使用同一套配色，避免启动阶段闪白/闪黑。
      (function () {
        var DARK_THEMES = ["dark", "crt-green", "ember", "synthwave", "terminal"];
        var THEMES = ["light", "dark", "arctic", "crt-green", "ember", "miami", "synthwave", "terminal", "vapor", "system"];
        var stored = "light";
        try {
          stored = localStorage.getItem("kcode_theme") || localStorage.getItem("kcoder_theme") || "light";
        } catch (_) {
          stored = "light";
        }
        if (THEMES.indexOf(stored) < 0) stored = "light";
        var resolved = stored;
        if (stored === "system") {
          resolved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        var tone = DARK_THEMES.indexOf(resolved) >= 0 ? "dark" : "light";
        var root = document.documentElement;
        root.setAttribute("data-skin", "codebuddy");
        root.setAttribute("data-theme", resolved);
        root.setAttribute("data-theme-preference", stored);
        root.setAttribute("data-boot-tone", tone);
        // 与 App.tsx 保持同一来源：样式按色调分流（浅色压深墨色 / 深色压暗背景图）。
        root.setAttribute("data-tone", tone);
      })();
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f6f8f6;
      }
      html[data-boot-tone="dark"],
      html[data-boot-tone="dark"] body {
        background: #181825;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f6f8f6;
        color: #57615b;
        font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        transition: opacity 0.24s ease;
      }
      html[data-boot-tone="dark"] #app-splash {
        background: #181825;
        color: #a4a9c4;
      }
      #app-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash .boot-mark {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        color: #176b4d;
      }
      html[data-boot-tone="dark"] #app-splash .boot-mark {
        color: #7aa2ff;
      }
      #app-splash .boot-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #app-splash .boot-hint {
        font-size: 12px;
        opacity: 0.72;
      }
      #app-splash .boot-bar {
        position: relative;
        width: 168px;
        height: 3px;
        overflow: hidden;
        background: rgba(23, 107, 77, 0.14);
        border-radius: 999px;
      }
      html[data-boot-tone="dark"] #app-splash .boot-bar {
        background: rgba(122, 162, 255, 0.18);
      }
      #app-splash .boot-bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: 999px;
        background: #176b4d;
        animation: boot-slide 1.05s ease-in-out infinite;
      }
      html[data-boot-tone="dark"] #app-splash .boot-bar::after {
        background: #7aa2ff;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(340%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .boot-bar::after {
          animation-duration: 2.4s;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 字体异步加载：离线或网络受限时不再阻塞首帧渲染（系统字体兜底已在 --font-family 中）。 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>

  <body>
    <div id="app-splash" role="status" aria-live="polite">
      <span class="boot-mark" aria-hidden="true">
        <svg viewBox="0 0 512 512" width="52" height="52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="kcode-boot-bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1A1A1E" />
              <stop offset="0.55" stop-color="#0C0C0E" />
              <stop offset="1" stop-color="#000000" />
            </linearGradient>
            <linearGradient id="kcode-boot-glyph" x1="0.18" y1="0" x2="0.85" y2="1">
              <stop offset="0" stop-color="#FFFFFF" />
              <stop offset="0.5" stop-color="#E8E8EF" />
              <stop offset="1" stop-color="#A8A8B8" />
            </linearGradient>
            <linearGradient id="kcode-boot-trail" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
              <stop offset="0" stop-color="#C9C9D6" stop-opacity="0.08" />
              <stop offset="0.55" stop-color="#D8D8E2" stop-opacity="0.4" />
              <stop offset="1" stop-color="#E8E8EF" stop-opacity="0.6" />
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="104" fill="url(#kcode-boot-bg)" />
          <g fill="none" stroke="url(#kcode-boot-glyph)" stroke-width="66" stroke-linecap="round">
            <path d="M214 112 C 194 200, 190 266, 204 366" />
            <path d="M208 258 C 280 240, 340 196, 392 128" />
            <path d="M208 262 C 284 284, 344 326, 400 360" />
          </g>
          <path d="M206 408 C 276 426, 340 418, 396 386" fill="none" stroke="url(#kcode-boot-trail)" stroke-width="26" stroke-linecap="round" />
        </svg>
      </span>
      <span class="boot-title">KCode</span>
      <span class="boot-bar" aria-hidden="true"></span>
      <span class="boot-hint">正在启动工作区…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
